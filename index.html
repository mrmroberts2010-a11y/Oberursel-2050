<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oberursel 2050</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: planning-office console. Student: decision stage left, map + own town + class leaderboard right. Teacher: same frame with round controls and a marking desk. */
:root{
  --bg:#eaeee9; --surface:#fbfcfa; --sunk:#dfe5df; --ink:#1b2826; --muted:#56655f; --line:#c3ccc4;
  --accent:#b8322a; --accent-soft:#f3dcd8; --on-accent:#ffffff;
  --forest:#9dbb94; --forest-ink:#3f6b3a; --water:#2f74b0; --built:#dccfbb; --road:#d99a2b;
  --ubahn:#2b56a3; --sbahn:#23824f; --paper:#f4f0e2;
  --good:#2f7d4a; --warn:#b07a12; --bad:#b8322a;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121917; --surface:#1a2321; --sunk:#222d2a; --ink:#e3ebe7; --muted:#9aaba4; --line:#33413d;
  --accent:#e2675c; --accent-soft:#3a2321; --on-accent:#1a0d0b;
  --forest:#35523a; --forest-ink:#9cc795; --water:#5ea3dd; --built:#4a4337; --road:#e0a843;
  --ubahn:#7aa0e8; --sbahn:#5cc48a; --paper:#26271f; --good:#5cc48a; --warn:#e0a843; --bad:#e2675c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121917; --surface:#1a2321; --sunk:#222d2a; --ink:#e3ebe7; --muted:#9aaba4; --line:#33413d;
  --accent:#e2675c; --accent-soft:#3a2321; --on-accent:#1a0d0b;
  --forest:#35523a; --forest-ink:#9cc795; --water:#5ea3dd; --built:#4a4337; --road:#e0a843;
  --ubahn:#7aa0e8; --sbahn:#5cc48a; --paper:#26271f; --good:#5cc48a; --warn:#e0a843; --bad:#e2675c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-block:14px 12px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;flex-wrap:wrap}
.brand h1{font-size:34px;font-weight:700}
.brand h1 span{color:var(--accent)}
.brand .sub{color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.who b{font-family:var(--f-display);font-size:20px}
.timer{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px;flex-wrap:wrap}
.clock{font:500 22px/1 var(--f-mono);min-width:66px;text-align:center}
.clock.low{color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 10px;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.big{padding:9px 16px;font:600 18px var(--f-display);letter-spacing:.02em}
.btn.small{padding:2px 7px;font-size:12px}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.status{font-size:13px;color:var(--muted)}
.status.ok{color:var(--good)} .status.err{color:var(--bad)}

.steps{display:flex;overflow-x:auto;margin-block:14px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.step{flex:1 0 auto;border:0;border-right:1px solid var(--line);background:none;padding:8px 12px;text-align:left;min-width:108px}
.step:last-child{border-right:0}
.step .l{display:block;font:600 10px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.step .t{display:block;font:600 16px/1.2 var(--f-display);margin-top:3px}
.step[aria-current="true"]{background:var(--ink);color:var(--bg)}
.step[aria-current="true"] .l{color:var(--bg);opacity:.75}
.step.locked{color:var(--muted)}
.step.done .t::after{content:" ✓";color:var(--good)}

.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;min-width:0}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

.stage-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.stage-head h2{font-size:40px;font-weight:700}
.stage-head .when{font:500 13px var(--f-mono);color:var(--muted);white-space:nowrap}
.brief{font-size:17px;max-width:66ch;margin:10px 0 16px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.fact{background:var(--surface);padding:10px 12px}
.fact b{display:block;font:600 26px/1.1 var(--f-display)}
.fact span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-block:8px 16px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--sunk)}
.chip b{font-weight:600}

.decision{margin-top:18px}
.decision>h3{font-size:24px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.decision>h3 .n{font:600 12px var(--f-mono);color:var(--accent);letter-spacing:.06em}
.decision>p{margin:4px 0 10px;color:var(--muted);font-size:14px;max-width:66ch}

.quiz{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.qrow{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:10px;border:1px solid var(--line);border-radius:6px}
.qrow.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.qrow .num{font:600 20px/1.1 var(--f-display);color:var(--accent)}
.qrow .ctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.gridin{width:64px;text-transform:uppercase;font:600 16px var(--f-mono);text-align:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:4px}
.mc{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 10px;text-align:left;font-size:14px;width:100%}
.mc[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.mark{font:600 13px var(--f-mono)}
.mark.y{color:var(--good)} .mark.n{color:var(--bad)}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.opts.three{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opt{border:1px solid var(--line);border-radius:7px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0;text-align:left}
.opt.sm{padding:10px 12px;gap:6px}
.opt.sm h3{font-size:18px}
button.opt:hover:not(:disabled){border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt[aria-pressed="true"] .letter{background:var(--accent);color:var(--on-accent)}
.opt-top{display:flex;gap:10px;align-items:flex-start}
.letter{flex:none;width:34px;height:34px;border-radius:5px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 22px/1 var(--f-display)}
.opt h3{font-size:21px;font-weight:600}
.opt .grid-ref{font:500 12px var(--f-mono);color:var(--muted)}
.opt p{margin:0;font-size:14px}
.wl{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.wl div{background:var(--sunk);border-radius:5px;padding:6px 8px}
.wl .w b{color:var(--good)} .wl .lo b{color:var(--bad)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font:500 12px var(--f-mono);color:var(--muted);margin-top:auto}
.deltas{display:flex;flex-wrap:wrap;gap:4px}
.d{font:500 11px var(--f-mono);padding:1px 6px;border-radius:3px;background:var(--sunk)}
.d.p{color:var(--good)} .d.n{color:var(--bad)}

.letter-card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px 18px;position:relative}
.letter-card .from{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.letter-card blockquote{margin:6px 0 12px;font:500 20px/1.3 var(--f-display)}
.letter-card .opts{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

.answer{margin-top:22px;border-top:2px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.answer label{font:600 20px var(--f-display)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:15px/1.5 var(--f-body);padding:10px;resize:vertical}
.answer .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wc{font:500 12px var(--f-mono);color:var(--muted)}
.checklist{display:flex;flex-wrap:wrap;gap:6px;font:500 12px var(--f-mono)}
.checklist span{padding:2px 7px;border-radius:3px;background:var(--sunk);color:var(--muted)}
.checklist span.ok{color:var(--good)}
.locked-note{background:var(--sunk);border-radius:6px;padding:10px 12px;font-size:14px;white-space:pre-wrap}

.event-card{border:2px solid var(--ink);border-radius:8px;padding:18px;background:var(--surface);position:relative;margin-bottom:14px}
.event-card .tag{position:absolute;top:-11px;left:14px;background:var(--accent);color:var(--on-accent);font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:3px}
.event-card h3{font-size:30px;margin-top:4px}
.event-card p{font-size:16px;max-width:64ch}
.hitnote{font-size:14px;margin:8px 0 0;color:var(--bad)}

.join{max-width:520px;margin:40px auto;display:flex;flex-direction:column;gap:14px}
.join h2{font-size:44px}
.join input{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:18px var(--f-body);padding:10px 12px}

.gm-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.gm-title h3{font-size:22px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.why{min-width:240px;max-width:460px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--surface);padding:3px 9px;font:600 13px var(--f-mono);min-width:30px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.rubric{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.rubric div{background:var(--sunk);border-radius:5px;padding:8px;font-size:13px}
.rubric b{font:600 18px var(--f-display);color:var(--accent);display:block}
.pill{display:inline-block;font:600 11px var(--f-mono);padding:1px 6px;border-radius:3px;background:var(--sunk)}
.pill.no{color:var(--muted)}
.evctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}

.maptabs{display:flex;gap:6px;flex-wrap:wrap}
.mapbox{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sunk)}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox.picking{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mapbox.picking svg{cursor:crosshair}
.layers{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:13px}
.layers label{display:flex;align-items:center;gap:5px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block}

.mine{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bar{font:500 11px var(--f-mono);color:var(--muted)}
.bar i{display:block;height:7px;border-radius:3px;background:var(--sunk);margin-top:3px;overflow:hidden}
.bar i s{display:block;height:100%;text-decoration:none}
.minemeta{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px var(--f-mono);color:var(--muted);margin-top:10px}
.minemeta .neg{color:var(--bad)}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.lb li:last-child{border-bottom:0}
.lb .rk{font:500 13px var(--f-mono);color:var(--muted)}
.lb .nm{font:600 18px/1.15 var(--f-display);overflow-wrap:anywhere}
.lb .ch{display:block;font:500 11px var(--f-mono);color:var(--muted)}
.lb .tot{font:600 24px/1 var(--f-display)}
.lb li.me{background:var(--accent-soft);margin-inline:-8px;padding-inline:8px;border-radius:5px}
.results td.num,.results th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

body.projector .gm{display:none!important}
@media (max-width:560px){.stage-head h2{font-size:30px}.brand h1{font-size:28px}.wl{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.opt,.step,.mc{transition:background .15s,border-color .15s,box-shadow .15s}}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><h1>Oberursel <span>2050</span></h1><span class="sub">Planning decision game · Year 9 Settlements</span></div>
  <div class="who" id="who"></div>
  <div class="timer" aria-label="Round timer"><span class="clock mono" id="clock">--:--</span><span id="tctl"></span></div>
</header>
<div id="app"><p class="status" style="margin-top:20px">Connecting to the class game…</p></div>

<script>
/* ================= content ================= */
const IND=[["eco","Economy"],["env","Environment"],["com","Community"],["con","Connectivity"]];
const BUDGET=75, TARGET=1500, MINWORDS=20;
const ROUNDS=[
 {id:"r0",lesson:1,title:"Map quiz",when:"L1 · 0–12 min"},
 {id:"r1",lesson:1,title:"New homes",when:"L1 · 12–32 min"},
 {id:"r2",lesson:1,title:"Moving people",when:"L1 · 32–46 min"},
 {id:"en",lesson:1,title:"Power the town",when:"L1 · 46–60 min"},
 {id:"ev",lesson:2,title:"Breaking news",when:"L2 · 0–10 min"},
 {id:"r3",lesson:2,title:"Sphere of influence",when:"L2 · 10–28 min"},
 {id:"ev2",lesson:2,title:"Second shock",when:"L2 · 28–36 min"},
 {id:"pitch",lesson:2,title:"Your pitch",when:"L2 · 36–50 min"},
 {id:"results",lesson:2,title:"Results",when:"L2 · 50–60 min"}
];
const RI=id=>ROUNDS.findIndex(r=>r.id===id);
const MARKED=["r1","r2","en","ev","r3","ev2"];

const QUIZ=[
 {id:"q1",type:"grid",q:"Find the Altstadt on the map. Which grid square is it in?",a:"C3"},
 {id:"q2",type:"grid",q:"Which grid square holds Hohemark, the end of the U3 line?",a:"B2"},
 {id:"q3",type:"grid",q:"Which grid square has the A661 “Oberursel” motorway junction?",a:"F4"},
 {id:"q4",type:"mc",q:"In which direction does the Urselbach flow?",opts:["North-west → south-east","South-east → north-west","West → east","South → north"],a:0},
 {id:"q5",type:"mc",q:"Which statement describes Oberursel's SITUATION, not its site?",opts:["It is built on gentle slopes at the foot of the Taunus","It is about 16 km north-west of Frankfurt, linked by the S5 and U3","It had clean water from the Urselbach","It lies about 200 m above sea level"],a:1},
 {id:"q6",type:"mc",q:"People from Oberursel travel to Frankfurt for the airport, university and opera. This shows that…",opts:["Oberursel's sphere of influence is bigger than Frankfurt's","Frankfurt is higher in the settlement hierarchy, and its sphere of influence includes Oberursel","Oberursel has no services at all","Frankfurt is a commuter settlement"],a:1}
];

/* Main choice per decision round */
const OPT={
 r1:{
  A:{t:"Weißkirchen-Ost fields",g:"D5",homes:1500,cost:10,d:{eco:8,env:-10,com:3,con:6},
     p:"Build a new estate on farmland at the rural–urban fringe, next to Weißkirchen-Ost station where the S5 and U3 meet.",
     w:"Commuters (two rail lines), builders, young families",l:"Farmers, wildlife, the green gap between Oberursel and Frankfurt",tags:"Greenfield · urban sprawl"},
  B:{t:"Drei Hasen brownfield",g:"E3",homes:1200,cost:22,d:{eco:4,env:4,com:0,con:2},
     p:"Clear old warehouses and offices beside the A661 and build flats. The land must be decontaminated and noise walls built.",
     w:"Green spaces are saved, derelict land is reused",l:"Taxpayers (most expensive), residents living with motorway noise",tags:"Brownfield · regeneration"},
  C:{t:"Densify around the Bahnhof",g:"C3",homes:1500,cost:12,d:{eco:6,env:2,com:-6,con:8},
     p:"Replace car parks and low buildings near Oberursel Bahnhof with 6–8 storey apartment blocks.",
     w:"People without cars, town-centre shops, the countryside",l:"Existing residents (shade, crowding, loss of character), drivers",tags:"Infill · high density"},
  D:{t:"Hohemark forest-edge villas",g:"B2",homes:400,cost:4,d:{eco:10,env:-12,com:-5,con:-4},
     p:"Release forest-edge land below the Taunus for large, expensive detached houses. Wealthy buyers pay high local taxes.",
     w:"The town budget, wealthy incomers",l:"Taunus forest, walkers, families who can't afford €1m homes. Only 400 homes!",tags:"Greenfield · low density"}
 },
 r2:{
  A:{t:"U3 upgrade + Park & Ride",g:"B2",cost:14,d:{eco:2,env:4,com:1,con:8},
     p:"Run the U3 every 7½ minutes and build a Park & Ride at Hohemark so Taunus villagers leave their cars at the edge of town.",
     w:"Commuters to Frankfurt, villages beyond the Taunus",l:"Budget; Hohemark residents get a big car park",tags:"Public transport"},
  B:{t:"Cycle superhighway",g:"C3 → C5",cost:9,d:{eco:1,env:7,com:3,con:5},
     p:"A wide, separated cycle route from the Altstadt to Frankfurt (16 km) and Bad Homburg, with e-bike parking at stations.",
     w:"Health, climate, students and young commuters",l:"Drivers lose road space; hilly northern districts benefit less",tags:"Active travel"},
  C:{t:"A661 junction + town car park",g:"F4 / C3",cost:12,d:{eco:6,env:-8,com:-2,con:7},
     p:"Widen the Oberursel junction on the A661 and build a 600-space multi-storey car park next to the Altstadt.",
     w:"Shops, delivery firms, drivers from villages",l:"Air quality, climate targets, people living on main roads",tags:"Road building"},
  D:{t:"Electric on-demand town bus",g:"all districts",cost:10,d:{eco:0,env:3,com:7,con:4},
     p:"Small electric buses booked by app link Oberstedten, Stierstadt, Weißkirchen and Bommersheim. Free for under-18s and over-65s.",
     w:"Teenagers, elderly people, families without a second car",l:"Budget every year; doesn't help commuting to Frankfurt much",tags:"Public transport · equity"}
 },
 en:{
  A:{t:"Wind turbines on the Taunus ridge",g:"A1 (off map, NW)",cost:8,d:{eco:4,env:8,com:-5,con:0},
     p:"Six turbines on the ridge near the Großer Feldberg would make enough electricity for every home in Oberursel.",
     w:"Climate, energy bills, landowners who rent out land",l:"Hikers, the view from the Feldberg, birds and bats",tags:"Renewable · landscape conflict"},
  B:{t:"Solar on every roof + batteries",g:"all districts",cost:11,d:{eco:1,env:6,com:2,con:0},
     p:"Grants put solar panels and home batteries on houses, schools and the new estate.",
     w:"Home owners' bills, no change to the landscape",l:"Budget; protected Altstadt roofs can't take panels; renters benefit less",tags:"Renewable · small-scale"},
  C:{t:"District heating plant at Drei Hasen",g:"E3",cost:7,d:{eco:4,env:4,com:0,con:0},

function add(ind,d){for(const k in d)ind[k]+=d[k]}
function quizScore(p){if(!p||!p.quiz)return 0;return QUIZ.filter(q=>q.type==="grid"?String(p.quiz[q.id]||"").toUpperCase().trim()===q.a:p.quiz[q.id]===q.a).length}
function compute(p,m){
  const t=p||{};m=m||{};const j=m.j||{};
  const ind={eco:50,env:50,com:50,con:50};let cost=0,homes=0;const notes=[];
  const take=o=>{if(!o)return;add(ind,o.d||{});cost+=o.cost||0};
  for(const rid of["r1","r2","en","r3"]){
    take(t[rid]&&OPT[rid][t[rid]]);
    (ROUND_SUBS[rid]||[]).forEach(s=>take(t[s]!=null&&SUB[s].opts[t[s]]));
    const sv=t["s_"+rid];take(sv&&STAKE[rid][sv]);
  }
  if(t.r1){homes=OPT.r1[t.r1].homes+((t.green&&SUB.green.opts[t.green].homes)||0)}
  (t.attr||[]).forEach(k=>{const a=ATTR[k];if(!a)return;cost+=a.cost;
    if(attrRevealed()){const o=attrOutcome(k,t);if(o.ok)add(ind,a.d);else{add(ind,{eco:-4,com:-1});notes.push(`Your ${a.t.toLowerCase()} closed: only ${fmt(o.people)} people in range, it needed ${fmt(a.thr)}.`)}}});
  const clash=CLASH(t);if(clash){add(ind,clash.d);notes.push(clash.n)}
  for(const rid of["ev","ev2"]){const e=evOf(rid);if(!e||RI(G.round)<RI(rid))continue;
    add(ind,e.base);const c=e.cond(t);if(c){add(ind,c.d);notes.push(c.n)}
    const r=t[rid];if(r&&e[r])take(e[r])}
  for(const k in ind)ind[k]=Math.max(0,Math.min(100,ind[k]));
  const si=(ind.eco+ind.env+ind.com+ind.con)/4;
  const weak=IND.filter(([k])=>ind[k]<35).length;
  const budget=BUDGET-cost;
  const shortfall=t.r1?Math.max(0,TARGET-homes):0;
  const penalty=-5*weak+Math.min(0,budget)-Math.ceil(shortfall/100);
  const just=MARKED.reduce((a,k)=>a+(j[k]||0),0);
  const pitch=(m.pitch||[]).reduce((a,b)=>a+(b||0),0);
  const quiz=quizScore(t);
  const total=Math.round(si+penalty+just*1.5+pitch+quiz);
  return{ind,si,cost,budget,homes,shortfall,weak,penalty,just,pitch,quiz,total,notes};
}

function choiceSummary(p,rid){
  if(!p)return"–";

  if(STAKE[rid])parts.push(p["s_"+rid]||"–");return parts.join(" · ");
}

function canEditRound(id){return LOCAL||G.round===id}
const has=(p,k)=>k==="attr"?!!(p.attr&&p.attr.length):p[k]!=null;
function needs(rid){const L=[[rid,"Main choice"]];if(rid==="r3")L.push(["attr","Attractions"]);(ROUND_SUBS[rid]||[]).forEach(s=>L.push([s,SUB[s].q.replace(/\?$/,"")]));if(STAKE[rid])L.push(["s_"+rid,"Stakeholder"]);return L}
function answerBox(id,label){
  const p=myDoc()||{};const saved=(p.why||{})[id]||"";const v=ui.drafts[id]??saved;const open=canEditRound(id);const msg=ui.msg[id];
  if(!open)return`<div class="answer"><label>${label}</label>${saved?`<div class="locked-note">${esc(saved)}</div>`:`<div class="locked-note muted">No justification submitted.</div>`}<span class="hint">This round is closed.</span></div>`;
  const list=(ROUND_SUBS[id]||STAKE[id])?needs(id):[];
  return`<div class="answer"><label for="why-${id}">${label}</label>
    ${list.length?`<div class="checklist">${list.map(([k,n])=>`<span class="${has(p,k)?"ok":""}">${has(p,k)?"✓":"○"} ${n}</span>`).join("")}</div>`:""}
    <textarea id="why-${id}" data-why="${id}" placeholder="${esc(STARTERS[id])}">${esc(v)}</textarea>

function decisionRound(rid,title,brief,extra){
  const r=ROUNDS[RI(rid)];const p=myDoc()||{};const open=canEditRound(rid);let n=1;
  let h=head(r,title)+`<p class="brief">${brief}</p>${extra||""}
   <section class="decision"><h3><span class="n">DECISION ${n++}</span>${{r1:"Choose a site",r2:"Choose a transport investment",en:"Choose an energy source",r3:"Choose a flagship project"}[rid]}</h3></section>${optionCards(rid,p[rid],open)}`;
  if(rid==="r3")h+=attrBlock(n++,p.attr||[],open,p);

  /* student decisions: held locally until "Lock in" */
  const p=Object.assign({why:{}},myDoc());
  if(d.pick){const[k,L]=d.pick.split(":");if(!canEditRound(k))return;p[k]=L;if(k==="r1")ui.hl="r1:"+L;P[me]=p;ui.msg[k]={ok:false,t:"Not saved yet: finish your decisions and lock in."};refreshStudent();return}
  if(d.sub){const[s,v]=d.sub.split(":");const rid=Object.keys(ROUND_SUBS).find(r=>ROUND_SUBS[r].includes(s));if(!canEditRound(rid))return;p[s]=v;P[me]=p;ui.msg[rid]={ok:false,t:"Not saved yet: finish your decisions and lock in."};refreshStudent();return}
  if(d.attr){if(!canEditRound("r3"))return;const list=(p.attr||[]).slice();const i=list.indexOf(d.attr);
    if(i>=0)list.splice(i,1);else{if(list.length>=MAXATTR){ui.msg.r3={ok:false,t:`You can choose up to ${MAXATTR} attractions. Remove one first.`};renderStudentStage();return}list.push(d.attr)}
    p.attr=list;P[me]=p;ui.msg.r3={ok:false,t:"Not saved yet: finish your decisions and lock in."};refreshStudent();return}
  if(d.stake){const[rid,v]=d.stake.split(":");if(!canEditRound(rid))return;p["s_"+rid]=v;P[me]=p;ui.msg[rid]={ok:false,t:"Not saved yet: finish your decisions and lock in."};refreshStudent();return}
  if(d.submit){const k=d.submit;const txt=(ui.drafts[k]??(p.why[k]||"")).trim();
    if(k!=="pitch"){const missing=(STAKE[k]||ROUND_SUBS[k])?needs(k).filter(([f])=>!has(p,f)):(!p[k]?[[k,"your response"]]:[]);
      if(missing.length){ui.msg[k]={ok:false,t:"Still to decide: "+missing.map(x=>x[1]).join(", ")+"."};renderStudentStage();return}}
    if(words(txt)<MINWORDS){ui.msg[k]={ok:false,t:`Write at least ${MINWORDS} words to justify your decisions.`};renderStudentStage();return}
    p.why=Object.assign({},p.why,{[k]:txt});delete ui.drafts[k];savePlayer(p,k,"Locked in. You can still change it until the round closes.");return}
  if(d.activeq){ui.activeQ=ui.activeQ===d.activeq?null:d.activeq;ui.mapView="town";renderStudentStage();renderMap();return}
  if(d.mc){const[q,k]=d.mc.split(":");ui.quizDraft[q]=+k;renderStudentStage();return}
  if(d.submitquiz!==undefined){p.quiz=Object.assign({},p.quiz||{},ui.quizDraft);ui.quizDraft={};savePlayer(p,"r0","Answers saved. You can change them until the round closes.");return}
  if(b.id==="town"&&ui.activeQ&&!gmView()){
    const pt=b.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const loc=pt.matrixTransform(b.getScreenCTM().inverse());
    if(loc.x<0||loc.x>=600||loc.y<0||loc.y>=500)return;
    const c=Math.floor(loc.x/100),r=Math.floor(loc.y/100);ui.pick={c,r};ui.quizDraft[ui.activeQ]="ABCDEF"[c]+(r+1);ui.activeQ=null;
    renderStudentStage();renderMap();setTimeout(()=>{ui.pick=null;renderMap()},1500);
  }
});
document.addEventListener("input",e=>{const d=e.target.dataset;
  if(d.why){ui.drafts[d.why]=e.target.value;const w=$("#wc-"+d.why);if(w)w.textContent=`${words(e.target.value)} words (min ${MINWORDS})`}
  if(d.grid){ui.quizDraft[d.grid]=e.target.value.toUpperCase().trim()}});
document.addEventListener("change",e=>{const d=e.target.dataset;if(d.layer){ui.layers[d.layer]=e.target.checked?1:0;renderMap()}
  if(e.target.id==="pickevent"&&e.target.value)setGame({[d.slot==="ev"?"event":"event2"]:e.target.value})});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="joinname"){const b=document.querySelector("[data-join]");if(b)b.click()}});

setInterval(()=>{const c=$("#clock");if(!c)return;if(!G.timerEnd){c.textContent="--:--";c.classList.remove("low");return}
  const left=Math.max(0,Math.round((G.timerEnd-Date.now())/1000));c.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");c.classList.toggle("low",left<=30)},500);

/* ================= boot ================= */
function mkId(){return Array.from({length:16},()=>"abcdefghijklmnopqrstuvwxyz0123456789"[Math.floor(Math.random()*36)]).join("")}
const memIds={};
function getId(cls){const k="ou2050-id-"+cls;try{let v=localStorage.getItem(k);if(!v){v=mkId();localStorage.setItem(k,v)}return v}catch(e){return memIds[k]||(memIds[k]=mkId())}}
function newId(cls){const k="ou2050-id-"+cls;const v=mkId();memIds[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
function resetClassState(){Object.keys(P).forEach(k=>delete P[k]);Object.keys(M).forEach(k=>delete M[k]);G={round:"r0",event:null,event2:null,timerEnd:null};ui.drafts={};ui.msg={};ui.quizDraft={};ui.sphereFor=null;ui.confirmReset=false}
async function switchClass(cls,keepScreen){
  CLS=cls;me=getId(cls);resetClassState();STUDENT_URL=location.origin+location.pathname+"?class="+cls;
  try{localStorage.setItem(isGM?"ou2050-teacher-class":"ou2050-class",cls)}catch(e){}
  if(!keepScreen){$("#app").innerHTML=`<p class="status" style="margin-top:20px">Loading ${esc(className(cls))}…</p>`}
  await poll(true);
  if(!pollTimer)pollTimer=setInterval(poll,isGM?4000:6000);
}
let polling=false;
async function poll(force){
  if(!CLS)return;
  if(polling&&!force)return;polling=true;
  try{
    const s=await api("getState",KEY||"",me,CLS);
    if(s.cls!==CLS)return;
    const prev=JSON.stringify([G.round,G.event,G.event2]);
    if(s.game)G=Object.assign({round:"r0",event:null,event2:null,timerEnd:null},s.game);
    const seen=new Set(Object.keys(s.players||{}));
    Object.keys(s.players||{}).forEach(id=>{if(id===me&&P[me])return;P[id]=s.players[id]});
    Object.keys(P).forEach(id=>{if(!seen.has(id)&&id!==me)delete P[id]});
    Object.keys(M).forEach(id=>delete M[id]);Object.assign(M,s.marks||{});
    if($("#joinname")&&!myDoc()&&!gmView()){renderTop();return}
    if(!$("#stage")||prev!==JSON.stringify([G.round,G.event,G.event2])){ui.activeQ=null;ui.msg={};renderAll()}
    else{renderBoard();renderDesk();renderMine();if(gmView())renderMap()}
  }catch(e){}finally{polling=false}
}
function renderClassPicker(){
  renderTop();
  $("#app").innerHTML=`<div class="join panel"><span class="label">Game master</span><h2>Which class are you teaching?</h2>
    <p>Each class has its own game, leaderboard and marks. You can switch class at any time from the top bar.</p>
    <div class="opts three">${CLASSES.map(c=>`<button class="opt sm" data-teachcls="${c.id}"><h3>${c.name}</h3><span class="grid-ref">${c.teacher}</span></button>`).join("")}</div></div>`;
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-teachcls]");if(b)switchClass(b.dataset.teachcls)});
document.addEventListener("change",e=>{if(e.target.id==="classpick"&&e.target.value!==CLS)switchClass(e.target.value)});
function renderLogin(err){
  $("#app").innerHTML=`<div class="join panel"><span class="label">Teacher</span><h2>Game master login</h2>
    <label for="pw" class="label">Teacher password</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn primary big" data-login>Open the game master view</button><span class="status err" id="loginmsg">${err||""}</span></div>`;
}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-login]");if(!b)return;
  const pw=$("#pw").value;$("#loginmsg").textContent="Checking…";
  let ok=false;try{ok=await api("checkKey",pw)}catch(err){}
  if(!ok){$("#loginmsg").textContent="That password isn't right.";return}
  KEY=pw;try{localStorage.setItem("ou2050-key",pw)}catch(err){}isGM=true;$("#app").innerHTML="";startTeacher()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pw"){const b=document.querySelector("[data-login]");if(b)b.click()}});
function startTeacher(){
  let c=URL_CLASS;if(!c){try{c=localStorage.getItem("ou2050-teacher-class")}catch(e){}}
  if(c&&CLASSES.some(x=>x.id===c))switchClass(c);else renderClassPicker();
}
(async function boot(){
  if(!CONFIGURED){$("#app").innerHTML=`<div class="join panel"><span class="label">Setup needed</span><h2>Almost there</h2><p>This page isn't connected to its Google Sheet yet. Open <span class="mono">index.html</span> on GitHub and paste your Apps Script web app link into <span class="mono">API_URL</span> near the top of the script. The README explains each step.</p></div>`;return}
  if(MODE==="teacher"){
    try{KEY=localStorage.getItem("ou2050-key")}catch(e){}
    let ok=false;if(KEY){try{ok=await api("checkKey",KEY)}catch(e){}}
    if(!ok){KEY=null;renderLogin();return}
    isGM=true;startTeacher();return;
  }
  let c=URL_CLASS;if(!c){try{c=localStorage.getItem("ou2050-class")}catch(e){}}
  if(c&&CLASSES.some(x=>x.id===c)){ui.joinCls=c;switchClass(c)}else renderJoin();
})();
</script>
